<!doctype html>
<html lang="fr" class="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0..1,0&display=block"
    />
    <script>
      // Masque les noms d'icônes tant que la police Material Symbols n'est pas prête
      ;(function () {
        function markReady() {
          document.documentElement.classList.add('fonts-ready')
        }
        if (document.fonts && document.fonts.load) {
          document.fonts
            .load('24px "Material Symbols Outlined"')
            .then(markReady)
            .catch(markReady)
          document.fonts.ready.then(markReady)
        } else {
          markReady()
        }
        setTimeout(markReady, 2500)
      })()
    </script>
    <title>Ophtamax — Management Platform</title>
    <style>
      /* Préloader critique : visible avant le bundle CSS */
      #app-preloader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.25rem;
        background: #eef3f3;
        transition: opacity 0.4s ease;
      }
      #app-preloader.is-hiding {
        opacity: 0;
        pointer-events: none;
      }
      #app-preloader .preloader-logo {
        width: min(220px, 55vw);
        height: auto;
        object-fit: contain;
        opacity: 1;
        transform-origin: center center;
        animation: preloader-breathe 2.4s ease-in-out infinite;
      }
      #app-preloader .preloader-label {
        margin: 0;
        font-family: Inter, system-ui, sans-serif;
        font-size: 0.875rem;
        font-weight: 500;
        letter-spacing: 0.04em;
        color: #2f393a;
        animation: preloader-label-breathe 2.4s ease-in-out infinite;
      }
      @keyframes preloader-breathe {
        0%,
        100% {
          opacity: 0.85;
          transform: scale(0.96);
        }
        50% {
          opacity: 1;
          transform: scale(1.04);
        }
      }
      @keyframes preloader-label-breathe {
        0%,
        100% {
          opacity: 0.55;
        }
        50% {
          opacity: 1;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #app-preloader .preloader-logo,
        #app-preloader .preloader-label {
          opacity: 1;
          animation: none;
          transform: none;
        }
      }
      @media print {
        #app-preloader { display: none !important; }
      }
    </style>
  </head>
  <body>
    <div
      id="app-preloader"
      role="status"
      aria-busy="true"
      aria-live="polite"
      aria-label="Chargement de l'application"
    >
      <img
        class="preloader-logo"
        src="/logo-kahydara.jpg"
        alt="New Cabinet Médical d'Ophtalmologie Kahydara"
        width="220"
        height="220"
      />
      <p class="preloader-label">Chargement…</p>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
